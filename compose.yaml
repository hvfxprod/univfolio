services:
  web:
    build:
      context: .
      target: runtime
    image: univfolio:local
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build:
      context: .
      target: api
    image: univfolio-api:local
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - univfolio_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  univfolio_data:
    name: univfolio_data
