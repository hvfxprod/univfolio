name: Docker build and smoke test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Smoke test
        run: |
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/ | grep 'id="root"'
          curl --fail http://localhost:8080/portfolio/example | grep 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/state)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost:8080' -H 'Content-Type: application/json' --data '{"email":"smoke@example.test","password":"Smoke-test-only-123","realName":"Smoke","studentId":"test","department":"test"}' http://localhost:8080/api/auth/signup)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost:8080' -H 'Content-Type: application/json' --data '{"email":"smoke@example.test","password":"Smoke-test-only-123"}' http://localhost:8080/api/auth/login)" = "403"
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down

