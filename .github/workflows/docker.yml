name: Docker build and smoke test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Smoke test
        run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/ | grep 'id="root"'
          curl --fail http://localhost:8080/portfolio/example | grep 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = "404"
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
